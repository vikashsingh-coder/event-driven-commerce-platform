services:

  # ========================================
  # PostgreSQL
  # ========================================

  postgres:

    image: postgres:17-alpine

    container_name: ecommerce-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - infra-network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ========================================
  # MongoDB
  # ========================================

  mongodb:

    image: mongo:8

    container_name: ecommerce-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - infra-network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ========================================
  # Redis
  # ========================================

  redis:

    image: redis:8-alpine

    container_name: ecommerce-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes"
      ]

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - infra-network

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ========================================
  # RabbitMQ
  # ========================================

  rabbitmq:

    image: rabbitmq:4-management

    container_name: ecommerce-rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - infra-network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:

      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


# ==========================================
# Networks
# ==========================================

networks:

  app-network:
    name: ecommerce-app-network
    driver: bridge

  infra-network:
    name: ecommerce-infra-network
    driver: bridge


# ==========================================
# Volumes
# ==========================================

volumes:

  postgres_data:
    name: ecommerce-postgres-data

  mongodb_data:
    name: ecommerce-mongodb-data

  redis_data:
    name: ecommerce-redis-data

  rabbitmq_data:
    name: ecommerce-rabbitmq-data